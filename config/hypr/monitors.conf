# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
# env = GDK_SCALE,2
# monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# --- Triple monitor setup ---
# Left monitor - 2560x1440 native
monitor=HDMI-A-1,2560x1440@144.01,0x0,1.00
# Center monitor - 4K scaled to 2560x1440 effective
monitor=DP-1,3840x2160@239.99,2560x0,1.50
# Right monitor - 2560x1440 native  
monitor=DP-3,2560x1440@165.00,5120x0,1.00

# --- Monitor Assignment Rules ---
# Forces games to open on the high-refresh 4K monitor
windowrulev2 = monitor monitor:DP-1, class:^(steam_app_.*)$
windowrulev2 = monitor monitor:DP-1, class:^(gamescope)$
windowrulev2 = monitor monitor:DP-1, title:^(.*game.*)$
windowrulev2 = monitor monitor:DP-1, class:^(unityplayer)$
windowrulev2 = monitor monitor:DP-1, class:^(lutris)$
windowrulev2 = monitor monitor:DP-1, class:^(heroic)$
windowrulev2 = monitor monitor:DP-1, class:^(Custom Game Name)$

# --- Scaling (Noscale) Rules ---
# Prevents 1.5x scaling from blurring games or causing mouse misalignment
windowrulev2 = noscale, class:^(steam_app_.*)$
windowrulev2 = noscale, class:^(gamescope)$
windowrulev2 = noscale, title:^(.*game.*)$
windowrulev2 = noscale, title:^(.*\.(exe|x86_64))$
windowrulev2 = noscale, class:^(unityplayer)$

# --- Specific Fixes ---
# Ensures Steam games take up the full screen immediately
windowrulev2 = fullscreen, class:^(steam_app_.*)$
# Godot fixes:
# Main Editor: Tile
windowrulev2 = tile, class:^(Godot)$, initialTitle:^(Godot)$
# Game Window: Float and Center
# (Matches windows with "DEBUG" in the title, which Godot uses for the runner)
windowrulev2 = tile, class:^(Godot)$, title:^(.*)(DEBUG)(.*)$
windowrulev2 = tile, class:^(Godot)$, title:^(.*)(DEBUG)(.*)$
